<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My tasks · Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <h1>My tasks</h1>
      <button class="small" id="logout">Log out</button>
    </div>

    <div class="add-form">
      <input type="text" id="new-title" placeholder="What do you need to do?" />
      <button id="add">Add task</button>
    </div>

    <p class="error" id="error"></p>
    <p class="count" id="count"></p>
    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
